name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # The harness packages are devDependencies so test/boot.test.mjs can
          # reach a real cordis Context. If that ever regresses the suite prints
          # SKIPPED and still exits 0 - a green tick proving nothing. This makes
          # that state a failed job, while a bare clone without the harness
          # installed can still run `pnpm test` normally.
          DSH_BOOT_STRICT: '1'
